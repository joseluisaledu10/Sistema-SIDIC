<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema DICyT</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                rgba(0, 0, 0, 0.20),
                rgba(0, 0, 0, 0.20)
            ),
            url("/static/img/fondo_login.jpg");

            background-size: cover;
            background-position: center 15%;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-radius: 18px;
            padding: 35px 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.30);
            text-align: center;
        }

        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .logos img {
            height: 120px;
            width: auto;
            object-fit: contain;
        }

        .titulo {
            color: #123c69;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 13px 45px 13px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #1b5e91;
            box-shadow: 0 0 5px rgba(27, 94, 145, 0.25);
        }

        .icono {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
            font-size: 18px;
        }

        .boton {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 10px;
            background: linear-gradient(135deg, #123c69, #1b6ca8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .boton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        .error {
            background: #ffe5e5;
            color: #b30000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .login-box {
                padding: 30px 25px;
            }

            .logos img {
                height: 60px;
            }

            .titulo {
                font-size: 19px;
            }
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <div class="login-box">

            <!-- LOGOS -->
            <div class="logos">

                
                <img src="/static/img/logo_dicyt_azul.png"
                     alt="Logo DICyT">

            </div>

            <!-- TITULO -->

            

            <!-- MENSAJE DE ERROR -->
            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <!-- FORMULARIO -->
            <form method="POST">

                <!-- USUARIO -->
                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <div class="input-box">

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingrese su usuario"
                            required
                            autocomplete="username"
                        >

                        <span class="icono">
                            👤
                        </span>

                    </div>

                </div>


                <!-- CONTRASEÑA -->
                <div class="campo">

                    <label for="contraseña">
                        Contraseña
                    </label>

                    <div class="input-box">

                        <input
                            type="password"
                            id="contraseña"
                            name="contraseña"
                            placeholder="Ingrese su contraseña"
                            required
                            autocomplete="current-password"
                        >

                        <span
                            class="icono"
                            onclick="mostrarContraseña()"
                            title="Mostrar contraseña"
                        >
                            👁
                        </span>

                    </div>

                </div>


                <!-- BOTON -->
                <button
                    type="submit"
                    class="boton"
                >
                    INGRESAR
                </button>

            </form>


            <!-- PIE -->
            <div class="footer">

                Universidad Amazónica de Pando

                <br>

                Dirección de Investigación, Ciencia y Tecnología

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        function mostrarContraseña() {

            const campo = document.getElementById("contraseña");

            if (campo.type === "password") {

                campo.type = "text";

            } else {

                campo.type = "password";

            }

        }

    </script>

</body>

</html>
