{% extends "base.html" %}

{% block title %}
Editar categoría - Sistema DICyT
{% endblock %}


{% block extra_css %}

<style>

    .encabezado {
        margin-bottom: 25px;
        text-align: center;
    }

    .encabezado h1 {
        margin: 0;
        color: #1e3a8a;
    }

    .encabezado p {
        margin-top: 6px;
        color: #666;
    }

    .panel {
        background: white;
        max-width: 800px;
        margin: 0 auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    .campo {
        margin-bottom: 20px;
    }

    .campo label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #374151;
    }

    .campo input,
    .campo textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .campo input:focus,
    .campo textarea:focus {
        outline: none;
        border-color: #1e3a8a;
    }

    .campo textarea {
        min-height: 120px;
        resize: vertical;
    }

    .botones {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .btn {
        border: none;
        padding: 11px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        font-size: 14px;
    }

    .btn-cancelar {
        background: #6b7280;
        color: white;
    }

    .btn-guardar {
        background: #1e3a8a;
        color: white;
    }

    .btn:hover {
        opacity: 0.9;
    }

</style>

{% endblock %}


{% block content %}

<div class="encabezado">

    <h1>✏️ Editar categoría</h1>

    <p>
        Modificar los datos de la categoría seleccionada
    </p>

</div>


<div class="panel">

    <form method="POST">


        <!-- CÓDIGO -->

        <div class="campo">

            <label for="codigo">
                Código
            </label>

            <input
                type="text"
                id="codigo"
                name="codigo"
                value="{{ categoria['codigo'] }}"
                required
            >

        </div>


        <!-- CATEGORÍA -->

        <div class="campo">

            <label for="categoria">
                Categoría
            </label>

            <input
                type="text"
                id="categoria"
                name="categoria"
                value="{{ categoria['categoria'] }}"
                required
            >

        </div>


        <!-- DESCRIPCIÓN -->

        <div class="campo">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                name="descripcion"
            >{{ categoria['descripcion'] or '' }}</textarea>

        </div>


        <!-- BOTONES -->

        <div class="botones">

            <button
                type="button"
                class="btn btn-cancelar"
                onclick="window.location.href='{{ url_for('categorias') }}'"
            >
                ↩️ Cancelar
            </button>


            <button
                type="submit"
                class="btn btn-guardar"
            >
                💾 Guardar cambios
            </button>

        </div>


    </form>

</div>

{% endblock %}
